spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${API_KEY}
      base-url: https://api.siliconflow.cn
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
  header: token  # token头部名称
logging:
  level:
    org.example.aispringboot: debug
---
#模拟生产环境
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.example.aispringboot: info
