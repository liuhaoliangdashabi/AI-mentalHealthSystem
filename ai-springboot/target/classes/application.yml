spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?userSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${API_KEY}
      base-url: https://api.siliconflow.cn
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
logging:
  level:
    org.example.aispringboot: info
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀
